# ─────────────────────────────────────────────────────────────
# Resource-cap override for small VPS hosts (~4GB RAM, 2 vCPU).
#
# docker-compose.prod.yml's default limits assume the project's
# recommended minimum (4 vCPU / 8GB) and sum to ~21GB across all
# services — fine as upper bounds on a bigger box, but on a 4GB
# box every container would happily try to grow toward its cap and
# the kernel OOM-killer would start picking victims at random.
#
# This file only overrides `deploy.resources.limits` — everything
# else (images, env, volumes, healthchecks) is inherited from
# docker-compose.prod.yml. Usage: pass both files together, e.g.
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.small.yml ...
#
# These caps sum to ~3.4GB, leaving real headroom for the host OS,
# Docker daemon, and page cache out of ~3.8GB usable RAM on a "4GB"
# droplet. An earlier version of this file summed to ~4.2GB — over
# the physical total before the OS even started — which under real
# load produced a full-blown OOM crash loop: the kernel/cgroup OOM
# killer repeatedly SIGKILLed api's gunicorn workers milliseconds
# after each one booted, so the api container never had a live
# worker to answer a request and every proxied /api/* call hung
# until nginx's own timeout. Lesson: always check the actual sum
# against `free -h` on the target box, not just against the labeled
# RAM size — verify with `docker stats` under real traffic too.
#
# api also needs GUNICORN_WORKERS trimmed on this tier (set it to 1
# in .env.production) — it imports several heavy ML libraries
# (resemblyzer → torch, face_recognition → dlib, faster-whisper →
# ctranslate2) at startup, so each additional worker process
# duplicates that entire import footprint. See scripts/deploy.sh,
# which now sets this automatically for fresh installs on small
# hosts — existing installs need the .env.production value updated
# by hand.
#
# Pair with a swap file (see deployment docs) as a safety net for
# transient spikes, and plan to drop this override (or resize the
# box) before onboarding meaningful paid traffic — this is a
# "launch and test" sizing, not a "serve many concurrent users" one.
# ─────────────────────────────────────────────────────────────

services:
  nginx:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  web:
    deploy:
      resources:
        limits:
          memory: 288M
          cpus: "0.5"

  api:
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1.0"

  ai:
    deploy:
      resources:
        limits:
          memory: 576M
          cpus: "1.0"

  pgbouncer:
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "0.25"

  postgres:
    deploy:
      resources:
        limits:
          memory: 288M
          cpus: "0.5"

  redis:
    # Base docker-compose.prod.yml hardcodes `--maxmemory 512mb` in redis's
    # command, which this override's cgroup cap can't see — Redis would
    # never trigger its own LRU eviction (it thinks it has 512MB of
    # headroom), so the kernel/cgroup OOM-kills the process outright
    # instead, silently dropping in-flight data (e.g. short-lived OAuth
    # state tokens) rather than gracefully evicting. Repeat the full
    # command here with maxmemory brought down under the cgroup cap —
    # compose replaces `command` wholesale on merge, no partial patching.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  qdrant:
    deploy:
      resources:
        limits:
          memory: 288M
          cpus: "0.5"

  ollama:
    deploy:
      resources:
        limits:
          memory: 900M
          cpus: "1.5"

  piper:
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.25"
