[project]
name = "replica-ai-api"
version = "0.1.0"
description = "Replica AI — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "qrcode[pil]>=7.4.0",
    "langdetect>=1.0.9",
    "python-multipart>=0.0.9",
    "resemblyzer>=0.1.3",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "faster-whisper>=1.0.0",
    "noisereduce>=3.0.0",
    "pydub>=0.25.1",
    "wyoming>=1.5.0",
    "face_recognition>=1.3.0",
    "Pillow>=10.0.0",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    "tenacity>=8.2.0",
    "pywebpush>=2.0.0",
    "py-vapid>=1.9.0",
    "psutil>=5.9.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "freezegun>=1.4.0",
    "respx>=0.20.0",
    "psycopg2-binary>=2.9.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
load = [
    "locust>=2.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit test with all external deps mocked",
    "integration: test that requires real Postgres/Redis and hits the running app",
    "slow: test that takes >1 second to run",
]
filterwarnings = [
    "ignore::DeprecationWarning:jose",
    "ignore::DeprecationWarning:passlib",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "app/main.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
