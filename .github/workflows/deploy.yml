name: Deploy

# Runs after code lands on main. This assumes branch protection on `main`
# requires the "CI" and "Test" workflows to pass before a PR can merge —
# see docs/deployment.md. If that's not set up yet, do that first: a
# straight `push` trigger here has no way to know those other workflows
# passed for this exact commit.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            sudo /opt/replica-ai/scripts/update.sh
