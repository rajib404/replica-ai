name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend unit tests ──────────────────────────────
  # Fast, no external services. Runs on every PR.
  api-unit:
    name: API · Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: pytest tests/unit -m unit -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: api-unit
          fail_ci_if_error: false

  # ─── Backend integration tests ───────────────────────
  # Runs against real Postgres + Redis containers.
  # Triggered on push to main; on PRs only when 'integration' label is set.
  api-integration:
    name: API · Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'integration')
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/replica_ai_test
      TEST_DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/replica_ai_test
      TEST_DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: integration-test-secret
      JWT_ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for services
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done

      - name: Run integration tests
        run: pytest tests/integration -m integration -v --cov=app --cov-report=xml

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: api-integration
          fail_ci_if_error: false

  # ─── Frontend unit tests (Jest + RTL) ────────────────
  web-unit:
    name: Web · Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate Prisma client
        run: cd ../../packages/db && npx prisma generate

      - name: Run Jest tests with coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: apps/web/coverage/coverage-final.json
          flags: web-unit
          fail_ci_if_error: false

  # ─── Frontend E2E tests (Playwright) ─────────────────
  # Boots a real Next.js dev server. Slower — only on push to main.
  web-e2e:
    name: Web · E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate Prisma client
        run: cd ../../packages/db && npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
