# ─────────────────────────────────────────────────────────
# Replica AI — HTTP vhost (always active)
#
# Kept deliberately separate from the HTTPS vhost
# (nginx/https.conf.template): nginx loads every file in
# conf.d/*.conf as one atomic config, so if the HTTPS block's
# ssl_certificate path didn't exist yet, nginx would refuse to
# start at all — including this HTTP block, which is exactly
# what's needed to serve the ACME challenge that obtains that
# certificate in the first place. deploy.sh renders the HTTPS
# template into conf.d/ only after certbot succeeds.
#
# Domain is templated as {{DOMAIN}}; the deploy script does
#   sed -i "s/{{DOMAIN}}/$DOMAIN/g" /etc/nginx/conf.d/replica-ai.conf
# inside the nginx container before reload.
# ─────────────────────────────────────────────────────────

# Internal upstreams (Docker DNS) — visible to https.conf.template too,
# since nginx parses all of conf.d/*.conf into one config regardless of
# which file defines vs. references them.
upstream replica_web {
    server web:3000;
    keepalive 32;
}

upstream replica_api {
    server api:8000;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}} www.{{DOMAIN}};

    # Allow ACME http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Bare healthcheck for the nginx container itself
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
