# Security response headers (HTML/SSR responses)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options            "DENY" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header Referrer-Policy            "no-referrer" always;
add_header Permissions-Policy         "geolocation=(), microphone=(self), camera=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-XSS-Protection           "0" always;

# CSP — adjust per app needs. The Next.js app may need 'unsafe-inline' for hydration in dev,
# in production it should be tightened with nonces if possible.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
