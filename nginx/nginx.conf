user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ───────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ─── Performance ──────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_tokens      off;

    client_max_body_size       100m;
    client_body_buffer_size    128k;
    client_header_buffer_size  4k;
    large_client_header_buffers 4 16k;

    proxy_buffer_size           4k;
    proxy_buffers               16 4k;
    proxy_busy_buffers_size     8k;
    proxy_connect_timeout       30s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;

    # ─── Gzip ─────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/vnd.api+json
        application/wasm
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ─── SSL defaults (TLS 1.2/1.3) ───────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ─── Rate limiting zones ──────────────────────────────
    # General API: 100 r/m per IP burst 50
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # Auth endpoints: 10 r/m per IP burst 5
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # WebSocket: 30 connection upgrades per minute
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=30r/m;
    # Connection cap per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # ─── WebSocket upgrade map ────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Trust the Docker bridge as the proxy chain hop
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # ─── Site configs ─────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
